[project]
name = "kubernetes-reliability-platform"
version = "0.1.0"
description = "Kubernetes Reliability Platform - hands-on SRE and cloud-native learning project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.11.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["services", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "B008",  # Depends() in FastAPI route defaults is intentional
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/user_service"]
markers = [
    "integration: marks tests requiring external services such as PostgreSQL",
    "e2e: marks end-to-end cross-service workflow tests requiring PostgreSQL",
]
