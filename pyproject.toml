[project]
name = "kubernetes-reliability-platform"
version = "0.1.0"
description = "Kubernetes Reliability Platform - hands-on SRE and cloud-native learning project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/user_service"]
markers = [
    "integration: marks tests requiring external services such as PostgreSQL",
]
