# Local kind development placeholder only — not a production credential.
# Matches .env.example, docker-compose.yml, and k8s/postgres/secret.yaml placeholder values.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ include "krp.namespace" . }}
  labels:
    app: postgres
    {{- include "krp.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.database.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database.name | quote }}
