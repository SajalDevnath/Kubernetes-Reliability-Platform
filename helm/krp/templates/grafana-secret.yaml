{{- if .Values.grafana.enabled }}
# Local kind development placeholder only — not a production credential.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: {{ include "krp.namespace" . }}
  labels:
    app: grafana
    {{- include "krp.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ .Values.grafana.adminPassword | quote }}
{{- end }}
