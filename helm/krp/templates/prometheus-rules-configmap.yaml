{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: {{ include "krp.namespace" . }}
  labels:
    app: prometheus
    {{- include "krp.labels" . | nindent 4 }}
data:
  krp_alerts.yml: |
    groups:
      - name: krp-sre-slos
        rules:
          - record: krp:http_requests:rate5m
            expr: |
              sum by (service) (
                rate(http_requests_total{service=~"user-service|payment-service", handler!="/health"}[5m])
              )
              or
              sum by (service) (
                rate(http_requests_total{service="order-service"}[5m])
              )

          - record: krp:sli:availability:ratio
            expr: |
              (
                (
                  sum by (service) (
                    increase(http_requests_total{service=~"user-service|payment-service", status!~"5..", handler!="/health"}[6h])
                  )
                  or
                  sum by (service) (
                    increase(http_requests_total{service="order-service", status!~"5.."}[6h])
                  )
                )
                /
                (
                  sum by (service) (
                    increase(http_requests_total{service=~"user-service|payment-service", handler!="/health"}[6h])
                  )
                  or
                  sum by (service) (
                    increase(http_requests_total{service="order-service"}[6h])
                  )
                )
              )
              and
              (
                (
                  sum by (service) (
                    increase(http_requests_total{service=~"user-service|payment-service", handler!="/health"}[6h])
                  )
                  or
                  sum by (service) (
                    increase(http_requests_total{service="order-service"}[6h])
                  )
                ) > 0
              )

          - record: krp:sli:errors:5xx:ratio
            expr: |
              1 - krp:sli:availability:ratio

          - record: krp:sli:latency:p95:seconds
            expr: |
              histogram_quantile(
                0.95,
                sum by (service, le) (
                  increase(http_request_duration_seconds_bucket{service=~"user-service|payment-service", handler!="/health"}[6h])
                )
                or
                sum by (service, le) (
                  increase(http_request_duration_seconds_bucket{service="order-service"}[6h])
                )
              )
              and on (service) (krp:sli:availability:ratio)

          - record: krp:slo:availability:target
            expr: |
              label_replace(vector(0.99), "service", "user-service", "", "")
              or label_replace(vector(0.99), "service", "order-service", "", "")
              or label_replace(vector(0.99), "service", "payment-service", "", "")

          - record: krp:slo:availability:error_budget:consumed
            expr: |
              (1 - krp:sli:availability:ratio) / 0.01

          - record: krp:slo:availability:error_budget:remaining
            expr: |
              clamp_min(1 - krp:slo:availability:error_budget:consumed, 0)

          - record: krp:slo:availability:compliant
            expr: |
              (krp:sli:availability:ratio >= bool 0.99)

          - record: krp:slo:latency:p95:compliant
            expr: |
              (krp:sli:latency:p95:seconds <= bool 0.5)
              and on (service) (krp:sli:latency:p95:seconds)

      - name: krp-service-health
        rules:
          - alert: KRPServiceTargetDown
            expr: up{job=~"user-service|order-service|payment-service"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Application scrape target is down
              description: Prometheus cannot scrape {{ "{{" }} $labels.job {{ "}}" }} at {{ "{{" }} $labels.instance {{ "}}" }}.

          - alert: KRPHigh5xxErrorRate
            expr: |
              (
                sum by (service) (
                  rate(http_requests_total{status=~"5.."}[5m])
                )
                /
                sum by (service) (
                  rate(http_requests_total[5m])
                )
              ) > 0.50
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: High 5xx error rate for {{ "{{" }} $labels.service {{ "}}" }}
              description: More than 50% of requests to {{ "{{" }} $labels.service {{ "}}" }} returned 5xx over the last 5 minutes.

      - name: krp-sre-alerts
        rules:
          - alert: KRPSLOAvailabilityViolation
            expr: krp:sli:availability:ratio < 0.99
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Availability SLO violation for {{ "{{" }} $labels.service {{ "}}" }}
              description: Request availability SLI is below the 99.0% SLO target over the 6-hour rolling window for {{ "{{" }} $labels.service {{ "}}" }}.

          - alert: KRPSLOErrorBudgetExhausted
            expr: krp:slo:availability:error_budget:remaining == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Availability error budget exhausted for {{ "{{" }} $labels.service {{ "}}" }}
              description: The 1% availability error budget is fully consumed for {{ "{{" }} $labels.service {{ "}}" }} over the 6-hour rolling window.

          - alert: KRPHighP95Latency
            expr: krp:sli:latency:p95:seconds > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: P95 latency SLO violation for {{ "{{" }} $labels.service {{ "}}" }}
              description: P95 request latency exceeds the 500ms SLO target over the 6-hour rolling window for {{ "{{" }} $labels.service {{ "}}" }}.

{{- if .Values.postgresExporter.enabled }}
      - name: krp-postgres-health
        rules:
          - alert: KRPPostgresExporterDown
            expr: up{job="postgres-exporter"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: PostgreSQL exporter scrape target is down
              description: Prometheus cannot scrape postgres-exporter at {{ "{{" }} $labels.instance {{ "}}" }}. PostgreSQL metrics are unavailable.

          - alert: KRPPostgresDown
            expr: up{job="postgres-exporter"} == 1 and pg_up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: PostgreSQL database is unreachable
              description: postgres-exporter is running but cannot connect to PostgreSQL (pg_up=0). The database at postgres:{{ .Values.postgres.service.port }} may be down or rejecting connections.
{{- end }}
{{- end }}
