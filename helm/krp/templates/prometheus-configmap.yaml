{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "krp.namespace" . }}
  labels:
    app: prometheus
    {{- include "krp.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.scrapeInterval }}

    scrape_configs:
      - job_name: user-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - user-service:{{ .Values.userService.service.port }}

      - job_name: order-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - order-service:{{ .Values.orderService.service.port }}

      - job_name: payment-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - payment-service:{{ .Values.paymentService.service.port }}
{{- end }}
