apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: {{ include "krp.namespace" . }}
  labels:
    app: payment-service
    {{- include "krp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port: {{ .Values.paymentService.service.port }}
      targetPort: {{ .Values.paymentService.service.port }}
