{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ include "krp.namespace" . }}
  labels:
    app: grafana
    {{- include "krp.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:{{ .Values.prometheus.service.port }}
        isDefault: true
        editable: false
{{- if .Values.loki.enabled }}
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:{{ .Values.loki.service.port }}
        isDefault: false
        editable: false
{{- end }}
{{- if .Values.tempo.enabled }}
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo:{{ .Values.tempo.service.queryPort }}
        isDefault: false
        editable: false
{{- end }}
{{- end }}
