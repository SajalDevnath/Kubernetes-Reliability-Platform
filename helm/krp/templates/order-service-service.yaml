apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ include "krp.namespace" . }}
  labels:
    app: order-service
    {{- include "krp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: {{ .Values.orderService.service.port }}
      targetPort: {{ .Values.orderService.service.port }}
