{{- if .Values.tempo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: {{ include "krp.namespace" . }}
  labels:
    app: tempo
    {{- include "krp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: tempo
  ports:
    - name: http
      port: {{ .Values.tempo.service.queryPort }}
      targetPort: {{ .Values.tempo.service.queryPort }}
    - name: otlp-grpc
      port: {{ .Values.tempo.service.otlpGrpcPort }}
      targetPort: {{ .Values.tempo.service.otlpGrpcPort }}
{{- end }}
