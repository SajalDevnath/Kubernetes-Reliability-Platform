name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: k8s_reliability
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d k8s_reliability"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: k8s_reliability
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: change_me
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Ruff lint
        run: uv run ruff check services tests

      - name: Run full pytest suite
        run: uv run pytest tests/ -v

      - name: Build user service Docker image
        run: docker build -f services/user_service/Dockerfile -t krp-user-service:ci .

      - name: Build order service Docker image
        run: docker build -f services/order_service/Dockerfile -t krp-order-service:ci .

      - name: Build payment service Docker image
        run: docker build -f services/payment_service/Dockerfile -t krp-payment-service:ci .

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/krp

      - name: Helm template
        run: helm template krp helm/krp > /dev/null
