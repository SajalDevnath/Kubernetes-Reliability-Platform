name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ephemeral kind
    runs-on: ubuntu-latest

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user service Docker image
        run: docker build -f services/user_service/Dockerfile -t krp-user-service:ci .

      - name: Build order service Docker image
        run: docker build -f services/order_service/Dockerfile -t krp-order-service:ci .

      - name: Build payment service Docker image
        run: docker build -f services/payment_service/Dockerfile -t krp-payment-service:ci .

      - name: Install kind
        run: |
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: Create ephemeral kind cluster
        run: kind create cluster --name krp

      - name: Create krp namespace
        run: kubectl create namespace krp

      - name: Load images into kind
        run: |
          kind load docker-image krp-user-service:ci --name krp
          kind load docker-image krp-order-service:ci --name krp
          kind load docker-image krp-payment-service:ci --name krp

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/krp

      - name: Helm template
        run: |
          helm template krp helm/krp \
            -f helm/krp/values.yaml \
            --set images.userService.tag=ci \
            --set images.orderService.tag=ci \
            --set images.paymentService.tag=ci > /dev/null

      - name: Helm upgrade --install
        run: |
          helm upgrade --install krp helm/krp \
            --namespace krp \
            --create-namespace=false \
            -f helm/krp/values.yaml \
            --set images.userService.tag=ci \
            --set images.orderService.tag=ci \
            --set images.paymentService.tag=ci

      - name: Wait for PostgreSQL
        run: kubectl wait --for=condition=available deployment/postgres -n krp --timeout=180s

      - name: Wait for user-service
        run: kubectl wait --for=condition=available deployment/user-service -n krp --timeout=180s

      - name: Wait for payment-service
        run: kubectl wait --for=condition=available deployment/payment-service -n krp --timeout=180s

      - name: Wait for order-service
        run: kubectl wait --for=condition=available deployment/order-service -n krp --timeout=180s

      - name: Wait for prometheus
        run: kubectl wait --for=condition=available deployment/prometheus -n krp --timeout=180s

      - name: Wait for grafana
        run: kubectl wait --for=condition=available deployment/grafana -n krp --timeout=180s

      - name: Show deployment status
        run: |
          kubectl get pods -n krp
          kubectl get svc -n krp
          helm status krp -n krp

      - name: Run in-cluster smoke tests
        run: |
          kubectl run curl-smoke \
            --restart=Never \
            --image=curlimages/curl:8.10.1 \
            -n krp \
            --command -- \
            sh -ec "$(cat <<'EOS'
          set -e

          curl -sf http://user-service:8001/health
          curl -sf http://payment-service:8003/health
          curl -sf http://order-service:8002/orders

          curl -sf http://prometheus:9090/-/ready
          curl -sf http://grafana:3000/api/health

          for url in \
            http://user-service:8001/metrics \
            http://order-service:8002/metrics \
            http://payment-service:8003/metrics; do
            body=$(curl -sf "$url")
            echo "$body" | grep -q http_requests_total
            echo "$body" | grep -q http_request_duration_seconds
          done

          attempt=1
          while [ "$attempt" -le 12 ]; do
            result=$(curl -sf "http://prometheus:9090/api/v1/query?query=up%7Bjob%3D~%22user-service%7Corder-service%7Cpayment-service%22%7D")
            if echo "$result" | grep user-service | grep -q '"1"' \
              && echo "$result" | grep order-service | grep -q '"1"' \
              && echo "$result" | grep payment-service | grep -q '"1"'; then
              echo "All Prometheus targets are UP"
              exit 0
            fi
            echo "Waiting for Prometheus targets (attempt ${attempt}/12)..."
            attempt=$((attempt + 1))
            sleep 5
          done

          echo "Prometheus targets did not all become UP in time"
          exit 1
          EOS
          )"
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/curl-smoke -n krp --timeout=180s
          kubectl delete pod curl-smoke -n krp --ignore-not-found

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name krp || true
